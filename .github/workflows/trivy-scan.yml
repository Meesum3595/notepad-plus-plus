name: Container Image Security Scan


on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  trivy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Build Docker image
        run: |
          docker build -t notepadpp-demo:latest .

      - name: Install Trivy
        uses: aquasecurity/trivy-action@v0.9.4
        with:
          version: 0.43.1   # or latest

      - name: Run Trivy on image
        id: trivy
        uses: aquasecurity/trivy-action@v0.9.4
        with:
          image-ref: notepadpp-demo:latest
          scan-type: image
          format: json
          output: trivy-report.json
          exit-code: '1'       # fail job on ANY vuln
          severity: CRITICAL,HIGH

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: trivy-report
          path: trivy-report.json

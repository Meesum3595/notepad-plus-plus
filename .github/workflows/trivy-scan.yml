name: "🛡️ Container Security (Trivy Docker)"

on:
  push:
    branches: [ feature/trivy-scan ]
  pull_request:
    branches: [ main ]

jobs:
  trivy-scan:
    name: Build & scan with Trivy
    runs-on: ubuntu-latest

    steps:
      # 1) Checkout
      - name: Check out code
        uses: actions/checkout@v3

      # 2) Build the container
      - name: Build Docker image
        run: |
          docker build \
            --file Dockerfile \
            --tag notepadpp-demo:latest \
            .

      # 3) Run Trivy via Docker
      - name: Run Trivy scan
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasecurity/trivy:0.45.0 image \
              --exit-code 1 \
              --format table \
              notepadpp-demo:latest

      # 4) Export JSON report
      - name: Generate Trivy JSON report
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v ${{ github.workspace }}:/workspace \
            aquasecurity/trivy:0.45.0 image \
              --exit-code 1 \
              --format json \
              --output /workspace/trivy-report.json \
              notepadpp-demo:latest

      # 5) Upload JSON report as artifact
      - name: Upload JSON report
        if: always()
        uses: actions/upload-artifact@v2
        with:
          name: trivy-report
          path: trivy-report.json

name: “Container Security Scan (Trivy)”

# trigger on pushes to your feature branch and on PRs into main
on:
  push:
    branches:
      - feature/trivy-scan
      - main
  pull_request:
    branches:
      - main

jobs:
  trivy-scan:
    name: Run Trivy filesystem scan
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Run Trivy scan on source
        uses: aquasecurity/trivy-action@v0.10.1
        with:
          scan-type: fs
          scan-target: .
          # only report HIGH and CRITICAL
          severity: HIGH,CRITICAL

      # fail the build if any HIGH or CRITICAL vulnerabilities are found
      - name: Enforce no HIGH/CRITICAL findings
        if: ${{ steps.trivy-scan.outcome == 'failure' }}
        run: |
          echo "❌ High/Critical vulnerabilities detected—failing build."
          exit 1

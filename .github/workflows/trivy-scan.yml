name: Container build & Trivy scan

on:
  push:
    branches:
      - feature/trivy-scan

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build Notepad++ container
        run: |
          docker build -t notepadpp-wine .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.13.0
        with:
          image-ref: notepadpp-wine:latest
          format: table
          exit-code: '1'        # non-zero if HIGH/CRITICAL vulns found
          severity: HIGH,CRITICAL

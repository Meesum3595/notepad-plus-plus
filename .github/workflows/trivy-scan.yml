name: Trivy Filesystem Scan

on:
  push:
    branches:
      - feature/trivy-scan
  pull_request:
    branches:
      - main
      - develop

jobs:
  trivy-scan:
    name: Run Trivy filesystem vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run Trivy scan
        # pin to a released version that exists
        uses: aquasecurity/trivy-action@v0.10.1
        with:
          scan-type: fs
          vuln-type: os,library
          severity: HIGH,CRITICAL
          output: trivy-report.txt

      - name: Upload Trivy report
        # use the stable upload-artifact version
        uses: actions/upload-artifact@v2
        with:
          name: trivy-report
          path: trivy-report.txt

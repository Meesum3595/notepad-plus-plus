name: Container Vulnerability Scan (Trivy)
# run on pushes to this feature branch (or adjust to main/develop as needed)
on:
  push:
    branches:
      - feature/trivy-scan

jobs:
  trivy-scan:
    name: Run Trivy OS & Library Scan
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      # If you’re building images, you’d setup buildx here.
      # Not needed for a filesystem scan:
      #- name: Set up Docker Buildx
      #  uses: docker/setup-buildx-action@v2

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.13.0
        with:
          # filesystem scan of the repo root
          scan-type: fs
          # comma-separated list of vulnerability types
          vuln-type: os,library
          # fail the job if any HIGH or CRITICAL is found
          severity-threshold: HIGH
          # output formats available: table (default), json, sarif
          format: table
          # exit code 1 on any vuln ≥ threshold (so the job goes red)
          exit-code: ‘1’

      - name: Upload SARIF report to GitHub Code Scanning
        if: always()     # we still want SARIF even on failure
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: results.sarif

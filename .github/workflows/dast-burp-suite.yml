name: DAST – Burp Suite headless scan

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  serve-demo:
    name: Serve demo page
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Python 3.x
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Serve index.html on localhost:8080
        run: |
          # launch a simple HTTP server in the background
          python -m http.server 8080 &

  burp-scan:
    name: Burp Suite headless scan
    runs-on: ubuntu-latest
    needs: serve-demo
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Download Burp Suite Community Edition
        run: |
          wget -q 'https://portswigger.net/burp/releases/download?product=community&version=2024.1.1&type=Jar' \
            -O burpsuite_community.jar

      - name: Create Burp config directory
        run: mkdir -p burp-config

      - name: Write Burp headless scan config
        run: |
          cat << 'EOF' > burp-config/config.json
          {
            "target": "http://localhost:8080/index.html",
            "scanType": "passive", 
            "scanPolicy": "Default"
          }
          EOF

      - name: Run Burp Suite headless scan
        run: |
          java -jar burpsuite_community.jar \
            --headless \
            --project-file=dast-burp-project.burp \
            --config-file=burp-config/config.json \
            --scan-url=http://localhost:8080/index.html
name: SCA – Snyk Vulnerability Scan

on:
  push:
    branches: [ feature/snyk-scan ]
  pull_request:
    branches: [ main ]

jobs:
  snyk:
    name: Run Snyk test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Snyk CLI
        uses: snyk/actions/setup@v1
        with:
          version: 'latest'
          token: ${{ secrets.SNYK_TOKEN }}

      - name: Authenticate Snyk
        run: snyk auth ${{ secrets.SNYK_TOKEN }}

      - name: Run Snyk test on all projects
        run: snyk test --all-projects --severity-threshold=medium

      - name: Upload Snyk HTML Report
        run: |
          mkdir -p snyk-reports
          snyk test --all-projects --json > snyk-reports/snyk-report.json

name: DAST – OWASP ZAP & Burp Suite

on:
  push:
    branches: [ feature/dast-setup, feature/dast-negative ]
  pull_request:
    branches: [ main ]

jobs:
  zap-full-scan:
    name: OWASP ZAP Full Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Serve demo site
        run: |
          nohup python3 -m http.server 8080 &
          sleep 5

      - name: Run ZAP full scan
        uses: zaproxy/action-full-scan@v0.5.0
        with:
          target: 'http://127.0.0.1:8080'
          format: 'HTML'
          rules_file_name: ''

      - name: Upload ZAP report
        uses: actions/upload-artifact@v3.1.2
        with:
          name: zap-report
          path: zap_report.html

  burp-scan:
    name: Burp Suite Headless Scan
    runs-on: ubuntu-latest
    needs: zap-full-scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Serve demo site
        run: |
          nohup python3 -m http.server 8080 &
          sleep 5

      - name: Run Burp Suite headless scan
        run: |
          docker pull portswigger/portswigger-burp
          docker run --rm --network host \
            -v "${{ github.workspace }}/burp-config:/config" \
            portswigger/portswigger-burp \
            --headless \
            --config-file /config/config.json \
            --report-file burp-report.xml \
            http://127.0.0.1:8080

      - name: Upload Burp report
        uses: actions/upload-artifact@v3.1.2
        with:
          name: burp-report
          path: burp-report.xml

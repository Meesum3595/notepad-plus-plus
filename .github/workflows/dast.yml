name: DAST – OWASP ZAP Positive Scan

on:
  push:
    branches:
      - feature/dast-positive
  pull_request:
    branches:
      - main

jobs:
  zap_positive:
    name: OWASP ZAP Positive Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4

      - name: Start local HTTP server
        run: |
          python3 -m http.server 8080 &
          sleep 5

      - name: Run ZAP full scan (positive)
        uses: zaproxy/action-full-scan@v0.5.0
        with:
          target: 'http://localhost:8080/index.html'
          docker_name: 'ghcr.io/zaproxy/zaproxy:stable'
          # never fail on any alert
          fail_action: 'false'
          # don’t try to file GitHub issues
          allow_issue_writing: 'false'

      - name: Show ZAP report snippet
        if: always()
        run: |
          echo "===== ZAP HTML Report (first 50 lines) ====="
          head -n 50 report_html.html || echo "(report_html.html missing)"
          echo "============================================="

name: DAST - OWASP ZAP Full Scan

on:
  pull_request:
    branches:
      - main

jobs:
  zap_scan:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python for local server (optional if using Python HTTP server)
      uses: actions/setup-python@v4

    - name: Start local HTTP server
      run: |
        python3 -m http.server 8080 &
        sleep 10

    - name: Run OWASP ZAP Full Scan
      uses: zaproxy/action-full-scan@v0.5.0
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        target: 'http://localhost:8080/index.html'
        docker_name: 'ghcr.io/zaproxy/zaproxy:stable'
        cmd_options: '-a -j -z "-config ajaxSpider.browserId=htmlunit"'
        fail_action: false

    - name: Upload ZAP Report Artifacts
      uses: actions/upload-artifact@v3.1.2
      with:
        name: zap-reports
        path: |
          report_html.html
          report_json.json
          report_md.md
